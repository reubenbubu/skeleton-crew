# Publishes a release when a version tag such as v0.1.0 is pushed: the crew
# binaries for linux and darwin on amd64 and arm64, their SHA256SUMS, and a
# GitHub artifact attestation for each binary. The binaries come from
# scripts/self-build.sh, so a self-build of the tag gives the same bytes.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestations
      attestations: write # store the attestations
    steps:
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' ||
            { echo "not a release version: $TAG" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: scripts/test.sh

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} scripts/self-build.sh "$TAG"
          done
          cd dist && sha256sum crew-* > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "Install it as project/AGENTS.md at $TAG describes." \
            dist/crew-linux-amd64 dist/crew-linux-arm64 dist/crew-darwin-amd64 dist/crew-darwin-arm64 dist/SHA256SUMS
